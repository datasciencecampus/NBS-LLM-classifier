[project]
name = "NBS-LLM-classifer"
version = "0.1.0"
description = "Python pipeline classifying free-text survey responses into ISCO/ISIC schemes"
authors = [{name = "Data Science Campus", email = "datasciencecampus@ons.gov.uk"}]
requires-python = ">=3.12"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
    "classifai[huggingface]",
    "matplotlib==3.11.0",
    "numpy==2.5.0",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "pyreadstat==1.3.6",
    "seaborn==0.13.2",
    "truststore==0.10.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "pytest>=9,<10",
    "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"demo/**/*.py" = ["E402"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.uv.sources]
classifai = { url = "https://github.com/datasciencecampus/classifai/releases/download/v1.1.1/classifai-1.1.1-py3-none-any.whl" }
